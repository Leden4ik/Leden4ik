    .l4 { animation: l4 17.0s linear infinite; }
    @keyframes l5 { 0%, 31.12% { opacity: 0 } 31.18%, 96% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes c5 { 0%, 34.06% { transform: translateX(183.6px) } 39.88%, 100% { transform: translateX(299.8px) } }
    .c5 { animation: c5 17.0s linear infinite; }
    .l5 { animation: l5 17.0s linear infinite; }
    @keyframes l6 { 0%, 41.94% { opacity: 0 } 42.00%, 96% { opacity: 1 } 98%, 100% { opacity: 0 } }
    .l6 { animation: l6 17.0s linear infinite; }
    @keyframes l7 { 0%, 44.59% { opacity: 0 } 44.65%, 96% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes c7 { 0%, 47.53% { transform: translateX(183.6px) } 51.24%, 100% { transform: translateX(259.0px) } }
    .c7 { animation: c7 17.0s linear infinite; }
