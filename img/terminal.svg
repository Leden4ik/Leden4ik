  <g class="l l8"><text x="28" y="318" class="out">+250 к здоровью, броня и $250 000. Остальные коды на luckyman.name</text></g>
  <g class="lend"><text x="28" y="348"><tspan class="pr">luckyman@orbit:~$ </tspan></text><rect class="cur" x="211.6" y="332" width="10" height="20"/></g>
