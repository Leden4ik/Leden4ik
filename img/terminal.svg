  <rect width="860" height="378" rx="14" fill="#0b0620" stroke="#ceb7ff" stroke-width="2"/>
  <rect x="1" y="1" width="858" height="38" rx="13" fill="#170c3a"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f87"/><circle cx="46" cy="20" r="6" fill="#ffd166"/><circle cx="66" cy="20" r="6" fill="#5cf08a"/>
  <text class="bar" x="430.0" y="25" text-anchor="middle">luckyman@orbit: ~</text>
    <g class="l l0"><text x="28" y="78"><tspan class="pr">luckyman@orbit:~$ </tspan><tspan class="cm">whoami</tspan></text><rect class="c0" x="28" y="58" width="860" height="30" fill="#0b0620"/></g>
  <g class="l l1"><text x="28" y="108" class="out">Никита Акимов, веб-разработчик и верстальщик</text></g>
