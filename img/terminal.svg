  <g class="l l3"><text x="28" y="168"><tspan class="pr">luckyman@orbit:~$ </tspan><tspan class="cm">ls ~/stack</tspan></text><rect class="c3" x="28" y="148" width="860" height="30" fill="#0b0620"/></g>
