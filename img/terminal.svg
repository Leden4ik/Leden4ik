<svg xmlns="http://www.w3.org/2000/svg" width="860" height="378" viewBox="0 0 860 378">
  <!-- Бортовой терминал как на luckyman.name: команды печатаются сами, цикл 17 секунд -->
  <style>
    text { font: 17px Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace; white-space: pre; }
